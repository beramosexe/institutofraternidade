name: Regenerate lockfile for TanStack security fix

on:
  push:
    branches:
      - codex/chat-gemini-canalizacoes
    paths:
      - package.json
      - .github/workflows/regenerate-tanstack-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: codex/chat-gemini-canalizacoes
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate npm lockfile
        run: |
          set -o pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund 2>&1 | tee /tmp/npm-lockfile.log
        env:
          NPM_CONFIG_FETCH_RETRIES: 3
          NPM_CONFIG_FETCH_TIMEOUT: 60000
      - name: Verify patched TanStack versions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const required = {
            '@tanstack/react-start': '1.168.60',
            '@tanstack/start-server-core': '1.169.39',
            '@tanstack/react-router': '1.170.41',
            '@tanstack/router-plugin': '1.168.18'
          };
          const expectedCore = '1.171.34';
          let failed = false;
          function compare(a, b) {
            const aa = a.split('.').map(Number);
            const bb = b.split('.').map(Number);
            for (let i = 0; i < 3; i++) if ((aa[i] || 0) !== (bb[i] || 0)) return (aa[i] || 0) - (bb[i] || 0);
            return 0;
          }
          for (const [name, min] of Object.entries(required)) {
            const installed = lock.packages[`node_modules/${name}`]?.version;
            console.log(`${name}: ${installed ?? 'MISSING'} (required >= ${min})`);
            if (!installed || compare(installed, min) < 0) failed = true;
          }
          const corePaths = Object.entries(lock.packages)
            .filter(([path]) => path.endsWith('/node_modules/@tanstack/router-core') || path === 'node_modules/@tanstack/router-core');
          for (const [path, pkg] of corePaths) {
            console.log(`${path}: ${pkg.version} (expected ${expectedCore})`);
            if (pkg.version !== expectedCore) failed = true;
          }
          if (failed) process.exit(1);
          NODE
      - name: Build application
        run: npm run build
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "fix(deps): regenerar lockfile com TanStack Start corrigido"
          git push origin HEAD:codex/chat-gemini-canalizacoes
